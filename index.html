<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FRESHLY & PREMIER — القائمة الإلكترونية</title>
<style>
  :root {
    --bg: #070b14;
    --bg-2: #0d1526;
    --card: #121c33;
    --card-2: #172340;
    --text: #f8fafc;
    --muted: #94a3b8;
    --gold: #f59e0b;
    --gold-2: #fbbf24;
    --gold-soft: rgba(245, 158, 11, 0.14);
    --green: #10b981;
    --green-2: #34d399;
    --green-soft: rgba(16, 185, 129, 0.15);
    --blue: #38bdf8;
    --red: #ef4444;
    --border: rgba(255, 255, 255, 0.08);
    --border-gold: rgba(245, 158, 11, 0.34);
    --shadow: 0 14px 34px rgba(0, 0, 0, 0.42);
    --radius-lg: 20px;
    --radius-md: 15px;
    --radius-sm: 11px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at top, #13213e 0%, var(--bg) 52%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Cairo", "Tajawal", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body.has-bottom-bar {
    padding-bottom: 92px;
  }

  .app-shell {
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 14px 36px;
  }

  .top-header {
    background: linear-gradient(135deg, rgba(18, 28, 51, 0.96), rgba(10, 17, 31, 0.96));
    border: 1px solid var(--border-gold);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .top-header::after {
    content: "";
    position: absolute;
    inset: -60px auto auto -60px;
    width: 170px;
    height: 170px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.18), transparent 70%);
    pointer-events: none;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }

  .brand-box {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 54px;
    height: 54px;
    border-radius: 16px;
    background: linear-gradient(145deg, var(--gold-2), #b45309);
    color: #09101d;
    display: grid;
    place-items: center;
    font-size: 26px;
    font-weight: 900;
    box-shadow: 0 8px 22px rgba(245, 158, 11, 0.28);
    flex-shrink: 0;
  }

  .brand-title {
    margin: 0;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.2px;
    color: #fff;
  }

  .brand-sub {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--gold-2);
    font-weight: 700;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill-btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 13px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s ease;
  }

  .pill-btn:hover, .pill-btn.active {
    border-color: var(--border-gold);
    background: var(--gold-soft);
    color: var(--gold-2);
  }

  .pill-btn.cart-pill {
    background: linear-gradient(135deg, var(--gold), #d97706);
    color: #09101d;
    border-color: transparent;
    font-weight: 800;
  }

  .controls-card {
    margin-top: 12px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
  }

  @media (max-width: 640px) {
    .controls-card {
      grid-template-columns: 1fr;
    }
  }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-icon {
    position: absolute;
    inset-inline-start: 13px;
    font-size: 15px;
    opacity: 0.7;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 10px 38px 10px 38px;
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
    transition: 0.2s;
  }

  .search-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.14);
  }

  .clear-search {
    position: absolute;
    inset-inline-end: 10px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: none;
  }

  .clear-search.visible {
    display: block;
  }

  .context-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .mini-tag {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 11px;
    font-size: 12px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .mini-tag strong {
    color: var(--text);
  }

  .categories-bar {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: none;
  }

  .categories-bar::-webkit-scrollbar {
    display: none;
  }

  .cat-chip {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    border-radius: 999px;
    padding: 9px 15px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: 0.2s;
  }

  .cat-chip.active {
    background: linear-gradient(135deg, var(--gold), #d97706);
    color: #09101d;
    border-color: transparent;
    font-weight: 800;
    box-shadow: 0 6px 18px rgba(245, 158, 11, 0.25);
  }

  .section-block {
    margin-top: 18px;
  }

  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 2px;
  }

  .section-title {
    margin: 0;
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-count {
    font-size: 12px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.04);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  @media (max-width: 680px) {
    .items-grid {
      grid-template-columns: 1fr;
    }
  }

  .item-card {
    background: linear-gradient(160deg, var(--card), rgba(14, 22, 41, 0.96));
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    transition: 0.2s ease;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
  }

  .item-card:hover {
    border-color: rgba(245, 158, 11, 0.28);
    transform: translateY(-1px);
  }

  .item-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .item-emoji-badge {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .item-info {
    flex: 1;
    min-width: 0;
  }

  .item-name {
    margin: 0;
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    line-height: 1.35;
  }

  .item-sub {
    margin: 3px 0 0;
    font-size: 11.5px;
    color: var(--muted);
  }

  .item-desc {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: #cbd5e1;
    line-height: 1.5;
  }

  .item-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 8px;
    border-top: 1px dashed rgba(255, 255, 255, 0.08);
  }

  .price-box {
    display: flex;
    flex-direction: column;
  }

  .price-main {
    font-size: 16px;
    font-weight: 900;
    color: var(--gold-2);
  }

  .price-alt {
    font-size: 11px;
    color: var(--muted);
  }

  .qty-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .add-btn {
    border: none;
    background: var(--gold-soft);
    border: 1px solid var(--border-gold);
    color: var(--gold-2);
    border-radius: 11px;
    padding: 8px 13px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: 0.18s;
  }

  .add-btn:hover {
    background: var(--gold);
    color: #09101d;
  }

  .stepper {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-2);
    border: 1px solid var(--border-gold);
    border-radius: 11px;
    padding: 3px;
  }

  .step-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: none;
    background: rgba(255, 255, 255, 0.07);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    display: grid;
    place-items: center;
  }

  .step-btn.plus {
    background: var(--gold);
    color: #09101d;
  }

  .step-qty {
    min-width: 22px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
  }

  .empty-box {
    text-align: center;
    padding: 40px 18px;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: var(--radius-lg);
    color: var(--muted);
    margin-top: 16px;
  }

  .floating-cart-bar {
    position: fixed;
    inset-inline: 12px;
    bottom: 12px;
    max-width: 956px;
    margin: 0 auto;
    background: linear-gradient(135deg, #162340, #0d1527);
    border: 1px solid var(--border-gold);
    border-radius: 18px;
    padding: 11px 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
    z-index: 90;
  }

  .floating-cart-bar.visible {
    display: flex;
  }

  .fcb-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .fcb-count {
    background: var(--gold);
    color: #09101d;
    font-weight: 900;
    font-size: 13px;
    min-width: 28px;
    height: 28px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    padding: 0 7px;
  }

  .fcb-label {
    font-size: 12px;
    color: var(--muted);
  }

  .fcb-total {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
  }

  .fcb-btn {
    border: none;
    background: linear-gradient(135deg, var(--gold-2), #d97706);
    color: #09101d;
    border-radius: 12px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    white-space: nowrap;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 15, 0.78);
    backdrop-filter: blur(6px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 120;
    padding: 12px;
  }

  @media (min-width: 640px) {
    .modal-backdrop {
      align-items: center;
    }
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-card {
    width: 100%;
    max-width: 580px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--bg-2);
    border: 1px solid var(--border-gold);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    margin: 0;
    font-size: 17px;
    font-weight: 900;
  }

  .close-modal-btn {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
  }

  .cart-tabs {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    background: var(--card);
    padding: 5px;
    border-radius: 13px;
    border: 1px solid var(--border);
  }

  .cart-tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 800;
    padding: 8px 10px;
    border-radius: 9px;
    cursor: pointer;
    transition: 0.2s;
  }

  .cart-tab-btn.active {
    background: var(--gold-soft);
    color: var(--gold-2);
    border: 1px solid var(--border-gold);
  }

  .editing-banner {
    margin-top: 10px;
    background: rgba(56, 189, 248, 0.14);
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 12px;
    padding: 9px 12px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12.5px;
    color: #bae6fd;
  }

  .editing-banner.visible {
    display: flex;
  }

  .cart-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .cart-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .cart-row-title {
    font-size: 13.5px;
    font-weight: 800;
  }

  .cart-row-sub {
    font-size: 11.5px;
    color: var(--muted);
  }

  .review-card {
    margin-top: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }

  .review-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 800;
    color: var(--gold-2);
    margin-bottom: 8px;
  }

  .review-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    font-size: 12px;
    color: #cbd5e1;
  }

  .form-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  @media (max-width: 520px) {
    .form-grid {
      grid-template-columns: 1fr;
    }
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field-group.full {
    grid-column: 1 / -1;
  }

  .field-label {
    font-size: 12px;
    font-weight: 700;
    color: #cbd5e1;
  }

  .field-input, .field-select, .field-textarea {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 11px;
    padding: 9px 11px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }

  .field-input:focus, .field-select:focus, .field-textarea:focus {
    border-color: var(--gold);
  }

  .field-textarea {
    min-height: 64px;
    resize: vertical;
  }

  .summary-box {
    margin-top: 14px;
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 800;
  }

  .summary-total {
    font-size: 18px;
    color: var(--gold-2);
    font-weight: 900;
  }

  .btn-row {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .done-action-btn {
    flex: 1.4;
    min-width: 130px;
    border: none;
    background: linear-gradient(135deg, #00e676 0%, #10b981 55%, #059669 100%);
    color: #04130c;
    border-radius: 14px;
    padding: 13px 22px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(16, 185, 129, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }

  .done-action-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 32px rgba(16, 185, 129, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.55);
  }

  .done-action-btn:active {
    transform: scale(0.98);
  }

  .done-action-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .secondary-action-btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    border-radius: 13px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .whatsapp-btn {
    border: none;
    background: #16a34a;
    color: #fff;
    border-radius: 13px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
  }

  .track-card {
    margin-top: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
  }

  .track-code {
    font-size: 16px;
    font-weight: 900;
    color: var(--gold-2);
    letter-spacing: 0.4px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    margin-top: 8px;
  }

  .st-pending { background: rgba(245, 158, 11, 0.16); color: #fbbf24; }
  .st-preparing { background: rgba(56, 189, 248, 0.16); color: #38bdf8; }
  .st-ready { background: rgba(16, 185, 129, 0.18); color: #34d399; }
  .st-delivered { background: rgba(148, 163, 184, 0.18); color: #e2e8f0; }

  .steps-tracker {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .step-node {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 6px;
    text-align: center;
    transition: 0.2s;
  }

  .step-node.done {
    background: rgba(16, 185, 129, 0.14);
    border-color: rgba(16, 185, 129, 0.45);
    color: #6ee7b7;
  }

  .step-node.current {
    background: rgba(245, 158, 11, 0.16);
    border-color: var(--gold);
    color: var(--gold-2);
    box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.16);
  }

  .step-node-icon {
    font-size: 16px;
    display: block;
    margin-bottom: 3px;
  }

  .step-node-label {
    font-size: 11px;
    font-weight: 800;
    line-height: 1.25;
  }

  .order-items-review {
    margin-top: 12px;
    border-top: 1px dashed rgba(255, 255, 255, 0.1);
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12.5px;
    color: #cbd5e1;
  }

  .order-item-line {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .rating-box {
    margin-top: 14px;
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    padding: 12px;
  }

  .stars-row {
    display: flex;
    gap: 6px;
    margin: 8px 0;
  }

  .star-btn {
    border: 1px solid var(--border);
    background: var(--bg-2);
    color: var(--muted);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    font-size: 19px;
    cursor: pointer;
    transition: 0.15s;

  function saveCart() {
    localStorage.setItem("freshly_menu_cart", JSON.stringify(state.cart));
  }

  function saveOrderHistory() {
    localStorage.setItem("freshly_order_history", JSON.stringify(state.orderHistory.slice(0, 20)));
    els.sentOrdersCount.textContent = state.orderHistory.length;
  }

  function getAllItemsMap() {
    const map = {};
    MENU_DATA.forEach(cat => {
      cat.items.forEach(item => {
        map[item.id] = { ...item, categoryId: cat.id, categoryAr: cat.ar, categoryEn: cat.en };
      });
    });
    return map;
  }

  const ITEMS_MAP = getAllItemsMap();

  function getItemPrice(item) {
    if (state.currency === "EUR") {
      return Number(item.priceEur || (item.priceEgp / EUR_TO_EGP).toFixed(2));
    }
    return Number(item.priceEgp || 0);
  }

  function formatMoney(amount, curr = state.currency) {
    const num = Number(amount || 0);
    if (curr === "EUR") {
      const clean = Number.isInteger(num) ? num : num.toFixed(2);
      return `€${clean}`;
    }
    const clean = Number.isInteger(num) ? num : num.toFixed(2);
    return `${clean} EGP`;
  }

  function getCartSummary() {
    let count = 0;
    let total = 0;
    const list = [];

    Object.entries(state.cart).forEach(([id, qty]) => {
      const q = Number(qty || 0);
      const item = ITEMS_MAP[id];
      if (q > 0 && item) {
        const unitPrice = getItemPrice(item);
        const lineTotal = Number((unitPrice * q).toFixed(2));
        count += q;
        total = Number((total + lineTotal).toFixed(2));
        list.push({
          ...item,
          qty: q,
          unitPrice,
          lineTotal
        });
      }
    });

    return { count, total, list };
  }

  function updateQty(itemId, delta) {
    const current = Number(state.cart[itemId] || 0);
    const next = Math.max(0, current + delta);
    if (next === 0) {
      delete state.cart[itemId];
    } else {
      state.cart[itemId] = next;
    }
    saveCart();
    renderMenu();
    renderCartSummaryUI();
    if (els.cartModal.classList.contains("open")) {
      renderCartModalList();
      renderPreSubmitReview();
    }
  }

  function getServiceLabel(val) {
    const isAr = state.lang === "ar";
    const map = {
      table: isAr ? "طاولة / جلسة" : "Table / Lounge",
      room: isAr ? "غرفة فندقية" : "Hotel Room",
      boat: isAr ? "قارب / رحلة بحرية" : "Boat / Cruise",
      delivery: isAr ? "توصيل" : "Delivery",
      pickup: isAr ? "استلام" : "Pickup"
    };
    return map[val] || val;
  }

  function renderMenu() {
    const isAr = state.lang === "ar";
    const q = state.search.trim().toLowerCase();
    els.clearSearchBtn.classList.toggle("visible", q.length > 0);

    const sections = MENU_DATA.filter(cat => state.activeCategory === "all" || cat.id === state.activeCategory)
      .map(cat => {
        const filteredItems = cat.items.filter(item => {
          if (!q) return true;
          const name = (isAr ? item.ar : item.en).toLowerCase();
          const altName = (isAr ? item.en : item.ar).toLowerCase();
          const desc = (isAr ? item.descAr : item.descEn).toLowerCase();
          return name.includes(q) || altName.includes(q) || desc.includes(q);
        });
        return { ...cat, filteredItems };
      })
      .filter(cat => cat.filteredItems.length > 0);

    if (!sections.length) {
      els.menuContainer.innerHTML = `
        <div class="empty-box">
          <div style="font-size:32px; margin-bottom:8px;">🍹</div>
          <div>${isAr ? "لا توجد أصناف مطابقة لبحثك حالياً." : "No matching items found."}</div>
        </div>
      `;
      return;
    }

    els.menuContainer.innerHTML = sections.map(cat => {
      const cardsHtml = cat.filteredItems.map(item => {
        const qty = Number(state.cart[item.id] || 0);
        const title = isAr ? item.ar : item.en;
        const subTitle = isAr ? item.en : item.ar;
        const desc = isAr ? item.descAr : item.descEn;
        const mainPrice = formatMoney(getItemPrice(item), state.currency);
        const altPrice = state.currency === "EGP"
          ? `€${item.priceEur || (item.priceEgp / EUR_TO_EGP).toFixed(1)}`
          : `${item.priceEgp} EGP`;

        const actionHtml = qty > 0
          ? `
            <div class="stepper">
              <button type="button" class="step-btn" data-action="dec" data-id="${item.id}">−</button>
              <span class="step-qty">${qty}</span>
              <button type="button" class="step-btn plus" data-action="inc" data-id="${item.id}">+</button>
            </div>
          `
          : `
            <button type="button" class="add-btn" data-action="inc" data-id="${item.id}">
              + ${isAr ? "إضافة" : "Add"}
            </button>
          `;

        return `
          <article class="item-card">
            <div class="item-top">
              <div class="item-emoji-badge">${item.icon || "🥤"}</div>
              <div class="item-info">
                <h3 class="item-name">${title}</h3>
                <p class="item-sub">${subTitle}</p>

      return `

          <div class="section-heading">

    els.menuContainer.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {

      btn.addEventListener("click", () => {

      });

    els.sentOrdersList.querySelectorAll("[data-hist-reconsider]").forEach(btn => {
      btn.addEventListener("click", () => {
        reconsiderSentOrder(btn.dataset.histReconsider);
      });

  async function reconsiderSentOrder(code) {
    const isAr = state.lang === "ar";
    let orderObj = state.orderHistory.find(o => o.code === code) || getLanPathValue(`pendingOrders/${code}`) || null;

    if (dbConnected && networkOnline) {
      try {
        const snap = await db.ref(`pendingOrders/${code}`).once("value");
        if (snap.exists()) {
          const liveOrder = snap.val();
          if (liveOrder.status && liveOrder.status !== "pending") {
            showToast(isAr ? "الطلب قيد التحضير بالفعل، يمكنك متابعته أو إرسال طلب إضافي" : "Order is already being prepared");
            closeModal(els.cartModal);
            openTrackingModalWithCode(code, true);
            return;
          }
          orderObj = liveOrder;
        }
      } catch (e) {
        console.warn("Fetch order for reconsider failed:", e);
      }
    }

    if (!orderObj) {
      showToast(isAr ? "تعذر تحميل بيانات الطلب" : "Could not load order");
      return;
    }

    state.cart = {};
    (orderObj.items || []).forEach(it => {
      if (it.id && ITEMS_MAP[it.id]) {
        state.cart[it.id] = Number(it.qty || 1);
      }
    });
    saveCart();

    if (orderObj.currency) {
      state.currency = orderObj.currency;
      localStorage.setItem("freshly_menu_currency", state.currency);
    }

    els.custName.value = orderObj.customerName || "";
    els.custPhone.value = orderObj.customerPhone || "";
    if (orderObj.serviceType) els.serviceType.value = orderObj.serviceType;
    els.locationRef.value = orderObj.tableOrRoom || orderObj.location || "";
    els.orderNotes.value = orderObj.notes || "";

    state.editingOrderCode = code;
    switchCartTab("current");
    applyLanguageUI();
    renderMenu();
    renderCartSummaryUI();
    renderCartModalList();
    showToast(isAr ? `تم تحميل ${code} لإعادة النظر والتعديل` : `Loaded ${code} for review`);
  }

  function switchCartTab(tab) {
    const isCurrent = tab === "current";
    els.tabCurrentOrder.classList.toggle("active", isCurrent);
    els.tabSentOrders.classList.toggle("active", !isCurrent);
    els.currentOrderPane.style.display = isCurrent ? "block" : "none";
    els.sentOrdersPane.style.display = isCurrent ? "none" : "block";
    if (!isCurrent) {
      renderSentOrdersList();
    }
  }

  function buildWhatsAppMessage(orderCode = "") {
    const isAr = state.lang === "ar";
    const { list, total } = getCartSummary();
    const name = els.custName.value.trim() || (isAr ? "عميل" : "Guest");
    const phone = els.custPhone.value.trim();
    const service = els.serviceType.value;
    const loc = els.locationRef.value.trim();
    const notes = els.orderNotes.value.trim();

    const lines = [];
    lines.push(`🍹 *FRESHLY & PREMIER*`);
    if (orderCode) lines.push(`🆔 رقم الطلب: *${orderCode}*`);
    lines.push(`👤 الاسم: ${name}`);
    if (phone) lines.push(`📱 الهاتف: ${phone}`);
    lines.push(`📍 الخدمة: ${service}${loc ? ` (${loc})` : ""}`);
    lines.push(`💱 العملة: ${state.currency}`);
    lines.push(`------------------`);
    list.forEach(item => {
      const itemName = isAr ? item.ar : item.en;
      lines.push(`• ${itemName} × ${item.qty} = ${formatMoney(item.lineTotal, state.currency)}`);
    });
    lines.push(`------------------`);
    lines.push(`💰 *الإجمالي: ${formatMoney(total, state.currency)}*`);
    if (notes) lines.push(`📝 ملاحظات: ${notes}`);

    return lines.join("\n");
  }

  function generateOrderCode() {
    const rand = Math.floor(100000 + Math.random() * 900000);
    return `WEB-${rand}`;
  }

  async function submitOrderToFirebase() {
    const isAr = state.lang === "ar";
    const { list, total } = getCartSummary();

    if (!list.length) {
      showToast(isAr ? "أضف صنفاً واحداً على الأقل أولاً" : "Please add at least one item");
      return;
    }

    const isUpdate = Boolean(state.editingOrderCode);
    const orderCode = state.editingOrderCode || generateOrderCode();
    const nowIso = new Date().toISOString();
    const customerName = els.custName.value.trim() || (isAr ? "عميل المنيو" : "Menu Guest");
    const customerPhone = els.custPhone.value.trim() || "";
    const serviceType = els.serviceType.value || "table";
    const locationRef = els.locationRef.value.trim() || "";
    const notes = els.orderNotes.value.trim() || "";

    const itemsPayload = list.map(row => ({
      id: row.id,
      name: row.ar,
      nameAr: row.ar,
      nameEn: row.en,
      qty: row.qty,
      price: row.unitPrice,
      unitPrice: row.unitPrice,
      total: row.lineTotal
    }));

    const orderRecord = {
      id: orderCode,
      code: orderCode,
      source: "web_menu",
      status: "pending",
      createdAt: nowIso,
      updatedAt: nowIso,
      revised: isUpdate,
      currency: state.currency,
      subtotal: total,
      total: total,
      customer: {
        name: customerName,
        phone: customerPhone,
        serviceType: serviceType,
        location: locationRef,
        notes: notes
      },
      customerName: customerName,
      customerPhone: customerPhone,
      serviceType: serviceType,
      tableOrRoom: locationRef,
      notes: notes,
      items: itemsPayload
    };

    const trackingRecord = {
      code: orderCode,
      status: "pending",
      createdAt: nowIso,
      updatedAt: nowIso,
      revised: isUpdate,
      customerName: customerName,
      serviceType: serviceType,
      location: locationRef,
      currency: state.currency,
      total: total,
      itemsCount: list.reduce((acc, i) => acc + i.qty, 0),
      items: itemsPayload
    };

    els.submitOrderBtn.disabled = true;
    els.submitOrderBtn.textContent = "⏳";

    const updates = {};
    updates[`pendingOrders/${orderCode}`] = orderRecord;
    updates[`orderTracking/${orderCode}`] = trackingRecord;

    await lanDb.ref().update(updates);

    let syncedCloud = false;
    if (dbConnected && networkOnline) {
      try {
        await db.ref().update(updates);
        syncedCloud = true;
      } catch (err) {
        console.warn("Cloud sync fallback to LAN:", err);
      }
    }

    state.lastOrderCode = orderCode;
    localStorage.setItem("freshly_last_order_code", orderCode);

    const existingIdx = state.orderHistory.findIndex(o => o.code === orderCode);
    if (existingIdx >= 0) {
      state.orderHistory[existingIdx] = orderRecord;
    } else {
      state.orderHistory.unshift(orderRecord);
    }
    saveOrderHistory();

    state.editingOrderCode = null;
    state.cart = {};
    saveCart();
    renderMenu();
    renderCartSummaryUI();
    closeModal(els.cartModal);

    openTrackingModalWithCode(orderCode, syncedCloud);
    showToast(isAr
      ? (syncedCloud ? `تم إرسال الطلب (${orderCode})` : `تم إرسال الطلب عبر الشبكة الداخلية (${orderCode})`)
      : (syncedCloud ? `Order sent (${orderCode})` : `Order sent on LAN (${orderCode})`));

    els.submitOrderBtn.disabled = false;
    els.submitOrderBtn.textContent = isAr ? "تم" : "Done";
  }

  function getStatusMeta(status) {
    const isAr = state.lang === "ar";
    switch (status) {
      case "preparing":
        return { step: 2, cls: "st-preparing", label: isAr ? "👨‍🍳 جاري التحضير" : "👨‍🍳 Preparing" };
      case "ready":
        return { step: 3, cls: "st-ready", label: isAr ? "✅ جاهز للتقديم" : "✅ Ready" };
      case "delivered":
        return { step: 4, cls: "st-delivered", label: isAr ? "🍽️ تم التوصيل" : "🍽️ Delivered" };
      default:
        return { step: 1, cls: "st-pending", label: isAr ? "⏳ تم الاستلام وبانتظار التأكيد" : "⏳ Received & Pending" };
    }
  }

  function renderTrackingCard(code, data, synced) {
    const isAr = state.lang === "ar";
    const localFallback = state.orderHistory.find(o => o.code === code) || getLanPathValue(`orderTracking/${code}`);
    const record = data || localFallback;

    if (!record) {
      els.trackResultBox.innerHTML = `
        <div class="track-card">
          <div class="track-code">${code}</div>
          <div style="margin-top:6px; color:var(--muted); font-size:13px;">
            ${isAr ? "لم يتم العثور على بيانات لهذا الرقم بعد." : "No live tracking record found for this code yet."}
          </div>
        </div>
      `;
      return;
    }

    const currentStatus = record.status || "pending";
    const st = getStatusMeta(currentStatus);
    const totalStr = formatMoney(record.total || 0, record.currency || state.currency);
    const itemsList = record.items || (localFallback && localFallback.items) || [];

    const stepsDef = [
      { idx: 1, icon: "📩", label: isAr ? "تم الاستلام" : "Received" },
      { idx: 2, icon: "🍹", label: isAr ? "جاري التحضير" : "Preparing" },
      { idx: 3, icon: "🔔", label: isAr ? "جاهز" : "Ready" },
      { idx: 4, icon: "🤝", label: isAr ? "تم التوصيل" : "Delivered" }
    ];

    const stepsHtml = stepsDef.map(s => {
      const cls = s.idx < st.step ? "done" : (s.idx === st.step ? "current" : "");
      return `
        <div class="step-node ${cls}">
          <span class="step-node-icon">${s.icon}</span>
          <div class="step-node-label">${s.label}</div>
        </div>
      `;
    }).join("");

    const itemsHtml = itemsList.length
      ? `<div class="order-items-review">
          <div style="font-weight:800; color:var(--gold-2); margin-bottom:2px;">${isAr ? "مراجعة أصناف الأوردر:" : "Order Items:"}</div>
          ${itemsList.map(it => `
            <div class="order-item-line">
              <span>${isAr ? (it.nameAr || it.name) : (it.nameEn || it.name)} × ${it.qty}</span>
              <span>${formatMoney(it.total || (it.price * it.qty), record.currency || state.currency)}</span>
            </div>
          `).join("")}
        </div>`
      : "";

    const canReconsider = currentStatus === "pending";
    const canRate = currentStatus === "ready" || currentStatus === "delivered" || Boolean(record.rating);

    const existingRating = record.rating || null;
    const activeStars = existingRating ? existingRating.stars : state.selectedRating;

    const ratingSectionHtml = canRate
      ? `
        <div class="rating-box">
          <div style="font-size:13px; font-weight:800; color:var(--gold-2);">
            ⭐ ${existingRating ? (isAr ? "شكراً لتقييمك!" : "Thank you for your rating!") : (isAr ? "قيّم تجربتك ومشروباتك" : "Rate your order")}
          </div>
          <div class="stars-row" id="ratingStarsRow">
            ${[1, 2, 3, 4, 5].map(n => `
              <button type="button" class="star-btn ${n <= activeStars ? "active" : ""}" data-star="${n}">★</button>
            `).join("")}
          </div>
          <input class="field-input" id="ratingCommentInput" type="text"
            placeholder="${isAr ? "أضف تعليقاً قصيراً (اختياري)..." : "Optional feedback..."}"
            value="${existingRating && existingRating.comment ? existingRating.comment : ""}" />
          <div style="margin-top:8px; display:flex; justify-content:flex-end;">
            <button type="button" class="done-action-btn" id="saveRatingBtn" style="flex:0; padding:8px 18px; font-size:14px;">
              ${isAr ? "تم" : "Done"}
            </button>
          </div>
        </div>
      `
      : `
        <div style="margin-top:10px; font-size:12px; color:var(--muted);">
          ⭐ ${isAr ? "سيظهر التقييم هنا فور جاهزية أو تسليم طلبك." : "Rating becomes available once your order is ready or delivered."}
        </div>
      `;

    els.trackResultBox.innerHTML = `
      <div class="track-card">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
          <span class="track-code">${code}</span>
          <span style="font-size:11.5px; color:var(--muted);">${synced ? (isAr ? "مزامنة مباشرة" : "Live Sync") : (isAr ? "شبكة داخلية" : "LAN Sync")}</span>
        </div>
        <div><span class="status-pill ${st.cls}">${st.label}</span></div>

        <div class="steps-tracker">${stepsHtml}</div>

        <div style="margin-top:10px; font-size:13px; color:#cbd5e1;">
          ${isAr ? "الإجمالي:" : "Total:"} <strong>${totalStr}</strong>
          ${record.location ? ` • ${isAr ? "الموقع:" : "Location:"} <strong>${record.location}</strong>` : ""}
        </div>

        ${itemsHtml}

        ${canReconsider ? `
          <div style="margin-top:12px;">
            <button type="button" class="add-btn" id="reconsiderFromTrackBtn" style="width:100%; justify-content:center;">
              🔄 ${isAr ? "إعادة النظر وتعديل الطلب في السلة" : "Reconsider & Edit Order in Cart"}
            </button>
          </div>
        ` : ""}

        ${ratingSectionHtml}
      </div>
    `;

    const recBtn = document.getElementById("reconsiderFromTrackBtn");
    if (recBtn) {
      recBtn.addEventListener("click", () => {
        closeModal(els.trackModal);
        openModal(els.cartModal);
        reconsiderSentOrder(code);
      });
    }

    const starsRow = document.getElementById("ratingStarsRow");
    if (starsRow) {
      starsRow.querySelectorAll(".star-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedRating = Number(btn.dataset.star || 5);
          starsRow.querySelectorAll(".star-btn").forEach(b => {
            b.classList.toggle("active", Number(b.dataset.star) <= state.selectedRating);
          });
        });
      });
    }

    const saveRatingBtn = document.getElementById("saveRatingBtn");
    if (saveRatingBtn) {
      saveRatingBtn.addEventListener("click", async () => {
        const comment = (document.getElementById("ratingCommentInput")?.value || "").trim();
        const ratingPayload = {
          orderCode: code,
          stars: state.selectedRating,
          comment,
          ratedAt: new Date().toISOString()
        };

        const updates = {};
        updates[`orderRatings/${code}`] = ratingPayload;
        updates[`orderTracking/${code}/rating`] = ratingPayload;

        await lanDb.ref().update(updates);

        if (dbConnected && networkOnline) {
          try {
            await db.ref().update(updates);
          } catch (err) {
            console.warn("Rating cloud sync error:", err);
          }
        }

        const idx = state.orderHistory.findIndex(o => o.code === code);
        if (idx >= 0) {
          state.orderHistory[idx].rating = ratingPayload;
          saveOrderHistory();
        }

        showToast(isAr ? "شكراً! تم حفظ تقييمك بنجاح" : "Thank you! Rating saved");
        renderTrackingCard(code, { ...record, rating: ratingPayload }, dbConnected && networkOnline);
      });
    }
  }

  function subscribeToTrackingCode(code) {
    if (typeof state.trackingUnsubscribe === "function") {
      state.trackingUnsubscribe();
      state.trackingUnsubscribe = null;
    }

    const cleanCode = (code || "").trim().toUpperCase();
    if (!cleanCode) return;

    const lanRef = lanDb.ref(`orderTracking/${cleanCode}`);
    const lanHandler = snap => {
      renderTrackingCard(cleanCode, snap.val(), dbConnected && networkOnline);
    };
    lanRef.on("value", lanHandler);

    let cloudRef = null;
    let cloudHandler = null;
    if (dbConnected && networkOnline) {
      cloudRef = db.ref(`orderTracking/${cleanCode}`);
      cloudHandler = snap => {
        if (snap.exists()) {
          lanDb.ref(`orderTracking/${cleanCode}`).set(snap.val());
          renderTrackingCard(cleanCode, snap.val(), true);
        }
      };
      cloudRef.on("value", cloudHandler);
    }

    state.trackingUnsubscribe = () => {
      lanRef.off("value", lanHandler);
      if (cloudRef && cloudHandler) cloudRef.off("value", cloudHandler);
    };
  }

  function openTrackingModalWithCode(code, synced = true) {
    const clean = (code || state.lastOrderCode || "").trim().toUpperCase();
    els.trackCodeInput.value = clean;
    openModal(els.trackModal);
    if (clean) {
      subscribeToTrackingCode(clean);
    } else {
      els.trackResultBox.innerHTML = "";
    }
  }

  function openModal(backdrop) {
    backdrop.classList.add("open");
  }

  function closeModal(backdrop) {
    backdrop.classList.remove("open");
  }

  function bindEvents() {
    els.langBtn.addEventListener("click", () => {
      state.lang = state.lang === "ar" ? "en" : "ar";
      localStorage.setItem("freshly_menu_lang", state.lang);
      applyLanguageUI();
      renderCategories();
      renderMenu();
      renderCartSummaryUI();
      if (els.cartModal.classList.contains("open")) {
        renderCartModalList();
        renderSentOrdersList();
      }
    });

    els.currencyBtn.addEventListener("click", () => {
      state.currency = state.currency === "EGP" ? "EUR" : "EGP";
      localStorage.setItem("freshly_menu_currency", state.currency);
      applyLanguageUI();
      renderMenu();
      renderCartSummaryUI();
      if (els.cartModal.classList.contains("open")) {
        renderCartModalList();
      }
    });

    els.searchInput.addEventListener("input", () => {
      state.search = els.searchInput.value;
      renderMenu();
    });

    els.clearSearchBtn.addEventListener("click", () => {
      els.searchInput.value = "";
      state.search = "";
      renderMenu();
    });

    const openCart = () => {
      switchCartTab("current");
      renderCartModalList();
      renderCartSummaryUI();
      openModal(els.cartModal);
    };

    els.openCartBtn.addEventListener("click", openCart);
    els.headerCartBtn.addEventListener("click", openCart);
    els.closeCartModal.addEventListener("click", () => closeModal(els.cartModal));

    els.tabCurrentOrder.addEventListener("click", () => switchCartTab("current"));
    els.tabSentOrders.addEventListener("click", () => switchCartTab("sent"));

    els.cancelEditOrderBtn.addEventListener("click", () => {
      state.editingOrderCode = null;
      renderCartModalList();
      showToast(state.lang === "ar" ? "تم إلغاء وضع تعديل الطلب السابق" : "Cancelled order edit mode");
    });

    [els.custName, els.serviceType, els.locationRef, els.orderNotes].forEach(inp => {
      inp.addEventListener("input", renderPreSubmitReview);
      inp.addEventListener("change", renderPreSubmitReview);
    });

    els.trackOpenBtn.addEventListener("click", () => openTrackingModalWithCode(state.lastOrderCode));
    els.closeTrackModal.addEventListener("click", () => closeModal(els.trackModal));
    els.searchTrackBtn.addEventListener("click", () => subscribeToTrackingCode(els.trackCodeInput.value));
    els.trackCodeInput.addEventListener("keydown", e => {
      if (e.key === "Enter") subscribeToTrackingCode(els.trackCodeInput.value);
    });

    [els.cartModal, els.trackModal].forEach(backdrop => {
      backdrop.addEventListener("click", e => {
        if (e.target === backdrop) closeModal(backdrop);
      });
    });

    els.clearCartBtn.addEventListener("click", () => {
      state.cart = {};
      state.editingOrderCode = null;
      saveCart();
      renderMenu();
      renderCartSummaryUI();
      renderCartModalList();
      showToast(state.lang === "ar" ? "تم تفريغ السلة" : "Cart cleared");
    });

    els.submitOrderBtn.addEventListener("click", submitOrderToFirebase);

    els.sendWaBtn.addEventListener("click", () => {
      const { list } = getCartSummary();
      if (!list.length) {
        showToast(state.lang === "ar" ? "السلة فارغة" : "Cart is empty");
        return;
      }
      const msg = encodeURIComponent(buildWhatsAppMessage(state.editingOrderCode || ""));
      window.open(`https://wa.me/${WHATSAPP_TARGET}?text=${msg}`, "_blank");
    });
  }

  function initPresets() {
    if (presetTable) {
      els.locationRef.value = presetTable;
    }
    if (presetService && ["table", "room", "boat", "delivery", "pickup"].includes(presetService)) {
      els.serviceType.value = presetService;
    }
    els.sentOrdersCount.textContent = state.orderHistory.length;
  }

  initPresets();
  applyLanguageUI();
  renderCategories();
  renderMenu();
  renderCartSummaryUI();
  bindEvents();
})();
</script>
</body>
</html>
