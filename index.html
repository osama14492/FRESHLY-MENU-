function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";

function addToCart(id){const item=DATA.items.find(x=>x.id===id);if(!item)return;const line=customerCart.find(x=>x.id===id);if(line)line.qty++;else customerCart.push({id:item.id,name:nameOf(item),priceEGP:Number(item.priceEGP)||0,qty:1});renderCart();}
function changeCartQty(id,delta){const line=customerCart.find(x=>x.id===id);if(!line)return;line.qty+=delta;if(line.qty<=0)customerCart.splice(customerCart.indexOf(line),1);renderCart();}
function renderCart(){const lines=$("cartLines");const total=customerCart.reduce((sum,x)=>sum+x.priceEGP*x.qty,0);if(!customerCart.length){lines.innerHTML='<div class="empty">'+(lang==="ar"?"السلة فارغة — أضف الأصناف التي تريدها":"Your cart is empty — add items to continue")+'</div>';}else{lines.innerHTML=customerCart.map(x=>'<div class="cart-row"><div><b>'+x.name+'</b><div>'+money(x.priceEGP*x.qty)+'</div></div><div class="qty-tools"><button onclick="changeCartQty(\\\''+x.id+'\\\',-1)">−</button><b>'+x.qty+'</b><button onclick="changeCartQty(\\\''+x.id+'\\\',1)">＋</button></div></div>').join("");}$("cartTotal").textContent=(lang==="ar"?"الإجمالي: ":"Total: ")+money(total);}
async function sendCustomerOrder(){const status=$("cartStatus"),btn=$("sendOrderBtn");if(!customerCart.length){status.textContent=lang==="ar"?"السلة فارغة":"Your cart is empty";return;}const customer=($("customerRoom").value||"").trim();if(!customer){$("customerRoom").focus();status.textContent=lang==="ar"?"اكتب رقم الغرفة أو الطاولة أو اسم العميل أولاً":"Enter a table, room or customer name";return;}if(!freshlyDb){status.textContent=lang==="ar"?"تعذر الاتصال بخدمة الطلبات. حاول مرة أخرى عند توفر الإنترنت.":"Order service is unavailable. Please try again online.";return;}btn.disabled=true;status.textContent=lang==="ar"?"جارٍ إرسال الطلب...":"Sending order...";const now=new Date();const orderId="WEB-"+Date.now()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();const total=customerCart.reduce((sum,x)=>sum+x.priceEGP*x.qty,0);const cart=customerCart.map(x=>({id:x.id,itemId:x.id,name:x.name,qty:x.qty,price:x.priceEGP,priceEGP:x.priceEGP,currency:"EGP",size:"كبير",sugar:"عادي",ice:"وسط",note:""}));const payload={id:orderId,customer,customerPhone:($("customerPhone").value||"").trim(),note:($("customerNote").value||"").trim(),cart,total,date:now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0"),time:now.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}),createdAt:now.toISOString(),status:"pending",source:"freshly-public-menu"};try{await freshlyDb.ref("pendingOrders/"+orderId).set(payload);customerCart.length=0;$("customerNote").value="";$("customerPhone").value="";renderCart();status.textContent=(lang==="ar"?"تم إرسال طلبك بنجاح. رقم الطلب: ":"Your order was sent. Order #")+orderId;}catch(error){console.error("Order submission failed",error);status.textContent=lang==="ar"?"لم يتم إرسال الطلب. تحقق من الاتصال وحاول مرة أخرى.":"Order could not be sent. Check your connection and retry.";}finally{btn.disabled=false;}}
